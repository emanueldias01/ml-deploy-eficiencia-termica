
services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - model-artifacts:/app/artifacts
    environment:
      DB_PATH: /app/data/heat_exchanger.db
      MODEL_PATH: /app/artifacts/linear_regression_model-

  inference:
    build:
      context: .
      dockerfile: Dockerfile.inference
    volumes:
      - model-artifacts:/app/artifacts:ro
    depends_on:
      train:
        condition: service_completed_successfully

volumes:
  model-artifacts:


# after run docker compose up -d, running docker-compose run --rm inference python src/inference.py --day-index=<day_index> --heat-efficiency=<percentage_efficiency>