
services:
  train:
    build:
      context: .
      dockerfile: Dockerfile.train
    volumes:
      - model-artifacts:/app/artifacts
    environment:
      DB_PATH: /app/data/heat_exchanger.db
      MODEL_PATH: /app/artifacts/linear_regression_model-
  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - model-artifacts:/app/artifacts:ro
    environment:
      MODEL_PATH: /app/artifacts/linear_regression_model-
    depends_on:
      train:
        condition: service_completed_successfully
    networks:
      - ml-heat-efficiency


volumes:
  model-artifacts:

networks:
  ml-heat-efficiency:
    driver: bridge