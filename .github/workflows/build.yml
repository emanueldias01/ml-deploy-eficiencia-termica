name: Build and Validate Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build train image
        run: docker build -f Dockerfile.train -t ml-train:latest .

      - name: Build inference image
        run: docker build -f Dockerfile.inference -t ml-inference:latest .

      - name: Save Docker images
        run: docker save ml-train:latest ml-inference:latest -o docker-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v6
        with:
          name: docker-images
          path: docker-images.tar
          retention-days: 1

  validation:
    name: Validate Training and Inference
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker images
        uses: actions/download-artifact@v6
        with:
          name: docker-images

      - name: Load Docker images
        run: docker load -i docker-images.tar

      - name: Train model
        run: |
          mkdir -p artifacts
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-train:latest

      - name: Validate model artifact
        run: |
          test -n "$(find artifacts -maxdepth 1 -type f -name 'linear_regression_model-*.pkl' -print -quit)"

      - name: Validate inference
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/artifacts:/app/artifacts" \
            ml-inference:latest \
            python src/inference.py --heat-efficiency 300